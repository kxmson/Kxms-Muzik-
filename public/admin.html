<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>KXMS — Music Admin</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0b0b0d;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
      padding-bottom: 60px;
    }

    .header {
      height: 72px;
      border-bottom: 1px solid #222;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 6vw;
      background: #0b0b0d;
    }

    .logo {
      font-weight: 900;
      letter-spacing: 0.2em;
      font-size: 22px;
    }

    .header a {
      color: #aaa;
      text-decoration: none;
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
      padding: 60px 6vw;
    }

    .eyebrow {
      color: #888;
      font-size: 12px;
      letter-spacing: 0.25em;
      font-weight: bold;
    }

    h1 {
      font-size: 48px;
      margin: 15px 0 10px;
    }

    .intro {
      color: #999;
      margin-bottom: 40px;
    }

    form {
      display: grid;
      gap: 20px;
    }

    label {
      display: block;
      color: #aaa;
      font-size: 14px;
      font-weight: bold;
    }

    input,
    textarea {
      display: block;
      width: 100%;
      margin-top: 8px;
      padding: 14px;
      border: 1px solid #292929;
      border-radius: 8px;
      background: #151518;
      color: white;
      font-size: 16px;
    }

    input[type="file"] {
      padding: 12px;
      color: #aaa;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 16px;
      border: 0;
      border-radius: 8px;
      background: white;
      color: black;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
    }

    #message {
      margin-top: 20px;
      padding: 15px;
      border-radius: 8px;
      background: #151518;
      color: #aaa;
      display: none;
    }

    .back {
      display: inline-block;
      margin-top: 30px;
      color: #888;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <header class="header">
    <div class="logo">KXMS</div>
    <a href="/">Music</a>
  </header>

  <main class="container">

    <div class="eyebrow">
      PRIVATE ADMIN
    </div>

    <h1>Upload Music</h1>

    <p class="intro">
      Add a new release to the KXMS music website.
    </p>

    <form id="uploadForm">

      <label>
        Admin Password
        <input
          type="password"
          id="password"
          required
        >
      </label>

      <label>
        Song Title
        <input
          type="text"
          name="title"
          placeholder="Enter song title"
          required
          <label>
  Release Status

  <select name="status">
    <option value="released">
      Released
    </option>

    <option value="coming-soon">
      Coming Soon
    </option>
  </select>
</label>
        >
      </label>

      <label>
        Artist
        <input
          type="text"
          name="artist"
          value="KXMS"
          required
        >
      </label>

      <label>
        Genre
        <input
          type="text"
          name="genre"
          value="Afrobeats"
        >
      </label>

      <label>
        Release Date
        <input
          type="date"
          name="releaseDate"
        >
      </label>

      <label>
        Description
        <textarea
          name="description"
          placeholder="Tell listeners about this release..."
        ></textarea>
      </label>

      <label>
        Audio File
        <input
          type="file"
          name="audio"
          required
        >
      </label>

      <label>
        Cover Artwork
        <input
          type="file"
          name="artwork"
        >
      </label>

      <button
        type="submit"
        id="uploadButton"
      >
        Upload Release
      </button>

    </form>

    <div id="message"></div>

    <a class="back" href="/">
      ← Back to KXMS Music
    </a>

  </main>

  <script>
    const form = document.getElementById("uploadForm");
    const message = document.getElementById("message");
    const button = document.getElementById("uploadButton");

    form.addEventListener("submit", async function(event) {

      event.preventDefault();

      message.style.display = "block";
      message.textContent = "Uploading...";
      button.disabled = true;

      const password =
        document.getElementById("password").value;

      const formData =
        new FormData(form);

      try {

        const response = await fetch(
          "/api/admin/upload",
          {
            method: "POST",
            headers: {
              "Authorization": "Bearer " + password
            },
            body: formData
          }
        );

        const data =
          await response.json();

        if (!response.ok) {
          throw new Error(
            data.error || "Upload failed"
          );
        }

        message.textContent =
          "✓ Release uploaded successfully!";

        form.reset();

      } catch (error) {

        message.textContent =
          "Error: " + error.message;

      } finally {

        button.disabled = false;

      }

    });
  </script>

</body>
</html>
