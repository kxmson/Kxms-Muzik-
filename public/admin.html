<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>KXMS — Admin</title>

  <link
    rel="stylesheet"
    href="/style.css"
  >

  <style>
    .admin {
      max-width: 700px;
      margin: 80px auto;
      padding: 0 6vw;
    }

    .admin h1 {
      font-size: 48px;
      margin-bottom: 10px;
    }

    .admin p {
      color: #999;
    }

    form {
      margin-top: 40px;
      display: grid;
      gap: 18px;
    }

    label {
      color: #aaa;
      font-size: 14px;
    }

    input,
    textarea {
      width: 100%;
      margin-top: 7px;
      padding: 14px;
      background: #151518;
      color: white;
      border: 1px solid #292929;
      border-radius: 8px;
      font-size: 16px;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    input[type="file"] {
      padding: 10px;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 15px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    #message {
      margin-top: 20px;
      color: #aaa;
    }

    .back {
      display: inline-block;
      margin-top: 30px;
      color: #aaa;
      text-decoration: none;
    }
  </style>

</head>

<body>

  <header class="header">

    <div class="logo">
      KXMS
    </div>

    <nav>
      <a href="/">Music</a>
    </nav>

  </header>


  <main class="admin">

    <p class="eyebrow">
      PRIVATE ADMIN
    </p>

    <h1>Upload Music</h1>

    <p>
      Add a new release to the KXMS music website.
    </p>


    <form id="uploadForm">

      <label>
        Admin Password

        <input
          type="password"
          id="password"
          required
        >

      </label>


      <label>
        Song Title

        <input
          type="text"
          name="title"
          placeholder="Enter song title"
          required
        >

      </label>


      <label>
        Artist

        <input
          type="text"
          name="artist"
          value="KXMS"
        >

      </label>


      <label>
        Genre

        <input
          type="text"
          name="genre"
          value="Afrobeats"
        >

      </label>


      <label>
        Release Date

        <input
          type="date"
          name="releaseDate"
        >

      </label>


      <label>
        Description

        <textarea
          name="description"
          placeholder="Tell listeners about this release..."
        ></textarea>

      </label>


      <label>
        Audio File

        <input
          type="file"
          name="audio"
          accept="audio/*"
          required
        >

      </label>


      <label>
        Cover Artwork

        <input
          type="file"
          name="artwork"
          accept="image/*"
        >

      </label>


      <button type="submit">
        Upload Release
      </button>

    </form>


    <div id="message"></div>


    <a
      class="back"
      href="/"
    >
      ← Back to KXMS Music
    </a>

  </main>


  <script>

    const form =
      document.getElementById("uploadForm");

    const message =
      document.getElementById("message");


    form.addEventListener(
      "submit",
      async event => {

        event.preventDefault();

        message.textContent =
          "Uploading...";


        const password =
          document.getElementById("password").value;


        const formData =
          new FormData(form);


        try {

          const response =
            await fetch(
              "/api/admin/upload",
              {
                method: "POST",

                headers: {
                  Authorization:
                    `Bearer ${password}`
                },

                body: formData
              }
            );


          const data =
            await response.json();


          if (!response.ok) {

            throw new Error(
              data.error ||
              "Upload failed"
            );

          }


          message.textContent =
            "✓ Release uploaded successfully.";


          form.reset();


        } catch (error) {

          message.textContent =
            "Error: " +
            error.message;

        }

      }
    );

  </script>

</body>

</html>
