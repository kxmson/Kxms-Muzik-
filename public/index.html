<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Official KXMS music. Listen to the latest releases."
  >

  <title>KXMS — Official Music</title>

  <link
    rel="stylesheet"
    href="/style.css"
  >
</head>

<body>

  <header class="site-header">

    <a
      class="logo"
      href="/"
    >
      KXMS
    </a>

    <nav>
      <a href="#music">Music</a>
      <a href="/admin.html">Admin</a>
    </nav>

  </header>


  <main>

    <!-- HERO -->

    <section class="hero">

      <div class="hero-content">

        <p class="eyebrow">
          OFFICIAL ARTIST WEBSITE
        </p>

        <h1>
          KXMS
        </h1>

        <p class="hero-text">
          Listen to the latest music directly
          from KXMS.
        </p>

        <a
          href="#music"
          class="hero-button"
        >
          EXPLORE MUSIC
        </a>

      </div>

    </section>


    <!-- LATEST RELEASE -->

    <section
      id="latest"
      class="latest-section"
    >

      <div class="section-label">
        LATEST RELEASE
      </div>

      <div
        id="featured"
        class="featured"
      >

        <div class="featured-cover">
          <span>KXMS</span>
        </div>

        <div class="featured-info">

          <p class="eyebrow">
            NOW AVAILABLE
          </p>

          <h2>
            Loading...
          </h2>

          <p>
            Loading latest release...
          </p>

          <button
            class="play-main"
            id="featuredPlay"
          >
            ▶ PLAY
          </button>

        </div>

      </div>

    </section>


    <!-- MUSIC -->

    <section
      id="music"
      class="music-section"
    >

      <div class="section-heading">

        <div>

          <p class="eyebrow">
            KXMS
          </p>

          <h2>
            Music
          </h2>

        </div>

        <span id="count">
          Loading...
        </span>

      </div>


      <div
        id="tracks"
        class="track-grid"
      ></div>

    </section>


    <!-- FOOTER -->

    <footer>

      <div class="footer-logo">
        KXMS
      </div>

      <p>
        Official music website.
      </p>

      <p class="copyright">
        © KXMS
      </p>

    </footer>

  </main>


  <!-- MUSIC PLAYER -->

  <div class="player">

    <div class="player-info">

      <div
        id="playerTitle"
        class="player-title"
      >
        Select a song
      </div>

      <div
        id="playerArtist"
        class="player-artist"
      >
        KXMS
      </div>

    </div>


    <audio
      id="audio"
      controls
    ></audio>

  </div>


  <script src="/app.js"></script>

</body>

</html>
